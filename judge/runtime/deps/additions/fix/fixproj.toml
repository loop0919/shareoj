# The template project: each submission becomes main.fix; the dependencies are fetched and type-checked at build time.
# Written by `fix init` and `fix deps add name@=version` (AtCoder's list, at the newest versions that resolve together,
# without regexp: see excluded.json), without the comments. fix build runs a project's preliminary_commands, so this
# file must never have any.
[general]
name = "judge"
version = "1.0.0"
fix_version = "1.6.1"

[build]
files = ["main.fix"]
# gmp-fix links -lgmp; the worker has the shared library but no development package with the linker name.
library_paths = ["/opt/judge-runtimes/addition-native/lib"]

[[dependencies]]
name = "character"
version = "=1.0.1"
git = { url = "https://github.com/tttmmmyyyy/fixlang-character.git" }

