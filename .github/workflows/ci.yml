name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-deploy-artifacts:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# Each job is short: work that does not depend on another job runs beside it, and the
# browser suites are split across runners.
jobs:
  web-ssr:
    name: Build SSR frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-web
      - name: Build SSR server
        run: bun run build
      - name: Read Playwright version
        id: playwright
        run: bun -e 'console.log("version=" + require("@playwright/test/package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Archive SSR server
        run: tar -czf .build/ssr.tar.gz .output
      - name: Upload SSR server for browser tests
        uses: actions/upload-artifact@v7
        with:
          name: frontend-ssr
          path: web/.build/ssr.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  web-check:
    name: Check frontend types and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-web
      - name: Check types
        run: bun run typecheck
      - name: Test the Lambda runtime client and the deployment smoke checks
        run: bun test
      - name: Test the pinned Bun release
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  web-lambda:
    name: Package frontend Lambda
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-web
      - name: Build and package frontend Lambda
        run: bun run package:lambda
      - name: Upload frontend Lambda package
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lambda
          path: web/.build/web.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          # Deploys keep the repository default; other runs need it only for the boot tests.
          retention-days: ${{ inputs.upload-deploy-artifacts && '0' || '1' }}
          overwrite: true

  web-infra:
    name: Validate frontend infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate and test frontend infrastructure
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test

  web-lambda-boot:
    # Boot the exact zip that deploys, on arm64 like the function: in the provided.al2023 image
    # it runs on, and on nodejs22.x, which the switch to Bun and its rollback rely on.
    name: Boot frontend Lambda (${{ matrix.runtime }})
    needs: web-lambda
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: provided.al2023
            image: public.ecr.aws/lambda/provided:al2023
          - runtime: nodejs22.x
            image: public.ecr.aws/lambda/nodejs:22
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun
        uses: ./.github/actions/setup-web
        with:
          install: 'false'
      - name: Download frontend Lambda package
        uses: actions/download-artifact@v8
        with:
          name: frontend-lambda
          path: web/.build
      - name: Test the packaged handler
        if: matrix.runtime == 'provided.al2023'
        run: bun scripts/test-lambda.mjs
      - name: Boot the package in the Lambda runtime image
        run: bun scripts/test-lambda-image.mjs .build/web.zip ${{ matrix.image }}

  web-browser:
    name: Test browser (${{ matrix.shard }}/8)
    needs: web-ssr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-web
      - name: Install a Japanese font
        # The runner has Chrome's libraries but no CJK font; use the font the share images ship.
        run: |
          mkdir -p ~/.local/share/fonts
          cp server/assets/fonts/ipaexg.ttf ~/.local/share/fonts/
          fc-cache -f ~/.local/share/fonts
      - name: Restore Chromium
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ needs.web-ssr.outputs.playwright-version }}
      - name: Install Chromium
        run: bun --bun playwright install --only-shell chromium
      - name: Download SSR server
        uses: actions/download-artifact@v8
        with:
          name: frontend-ssr
          path: web/.build
      - name: Extract SSR server
        run: tar -xzf .build/ssr.tar.gz
      - name: Run browser tests
        run: bun --bun playwright test --shard=${{ matrix.shard }}/8 --workers=4 --reporter=dot,html
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          overwrite: true

  web-account:
    name: Test accounts (${{ matrix.shard }}/2)
    needs: web-ssr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Match the lockfile so browsers and OS libraries are ready without apt downloads.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.web-ssr.outputs.playwright-version }}-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openoj_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openoj_test
        options: >-
          --health-cmd "pg_isready -U openoj_test -d openoj_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://openoj_test:test-only-password@postgres:5432/openoj_test?sslmode=disable
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Set up Bun
        # The Playwright image has no unzip, which oven-sh/setup-bun needs.
        run: python3 scripts/bun_release.py install /usr/local/bin
      - name: Keep Node.js out of the tests
        run: echo "$GITHUB_WORKSPACE/web/scripts/no-node" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download SSR server
        uses: actions/download-artifact@v8
        with:
          name: frontend-ssr
          path: web/.build
      - name: Extract SSR server
        run: tar -xzf .build/ssr.tar.gz
      - name: Run account tests
        run: bun --bun playwright test --config playwright.account.config.ts --shard=${{ matrix.shard }}/2 --reporter=dot,html
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-account-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results-account/
          retention-days: 7
          overwrite: true

  web:
    # Keep the existing required check; every frontend job must succeed before it passes.
    name: Test SSR frontend
    if: ${{ always() }}
    needs: [web-ssr, web-check, web-lambda, web-infra, web-lambda-boot, web-browser, web-account]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all frontend checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success; done

  test:
    name: Test and package API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openoj_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openoj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openoj_test -d openoj_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://openoj_test:test-only-password@127.0.0.1:5432/openoj_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run tests
        working-directory: api
        run: go test ./...

      - name: Run static analysis
        working-directory: api
        run: go vet ./...

      - name: Test and build authoring CLI
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o shareoj .

      - name: Build Lambda package
        working-directory: api
        run: make package package-judge

      - name: Test judge validation and sandbox metadata
        run: python3 -m unittest discover -s judge/tests -v

      - name: Verify Lambda package
        run: |
          test -s api/.build/api.zip
          test -s api/.build/migrate.zip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate and test Terraform
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap api deploy-access judge domain; do
            terraform -chdir="infra/$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$root" validate
            terraform -chdir="infra/$root" test
          done

      - name: Upload API Lambda packages
        if: inputs.upload-deploy-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-lambda
          path: |
            api/.build/api.zip
            api/.build/migrate.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true
