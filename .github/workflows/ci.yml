name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-deploy-artifacts:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Test SSR frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openoj_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openoj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openoj_test -d openoj_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://openoj_test:test-only-password@127.0.0.1:5432/openoj_test?sslmode=disable
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Build SSR server
        run: npm run build
      - name: Build and test frontend Lambda
        run: |
          npm run package:lambda
          npm run test:lambda
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate frontend infrastructure
        working-directory: infra/frontend
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test
      - name: Install Chromium
        run: |
          # Playwright downloads its own Chromium. The runner's unrelated Chrome
          # APT feed can have inconsistent indexes while Google publishes updates.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Test SSR, browser rendering and PostgreSQL accounts
        shell: bash
        run: |
          # The suites use separate API servers, ports and output directories.
          npm test &
          browser_pid=$!
          npx playwright test --config playwright.account.config.ts &
          account_pid=$!
          # Wait for both suites and preserve either failure (bare wait loses it).
          status=0
          wait "$browser_pid" || status=1
          wait "$account_pid" || status=1
          exit "$status"
      - name: Test deployment smoke checks
        run: node --test scripts/smoke-frontend.test.mjs

      - name: Upload frontend Lambda package
        if: inputs.upload-deploy-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lambda
          path: web/.build/web.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  test:
    name: Test and package API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openoj_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openoj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openoj_test -d openoj_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://openoj_test:test-only-password@127.0.0.1:5432/openoj_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run tests
        working-directory: api
        run: go test ./...

      - name: Run static analysis
        working-directory: api
        run: go vet ./...

      - name: Test and build authoring CLI
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o shareoj .

      - name: Build Lambda package
        working-directory: api
        run: make package package-judge

      - name: Test judge validation and sandbox metadata
        run: python3 -m unittest discover -s judge/tests -v

      - name: Verify Lambda package
        run: |
          test -s api/.build/api.zip
          test -s api/.build/migrate.zip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate and test Terraform
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap api deploy-access judge domain; do
            terraform -chdir="infra/$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$root" validate
            terraform -chdir="infra/$root" test
          done

      - name: Upload API Lambda packages
        if: inputs.upload-deploy-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-lambda
          path: |
            api/.build/api.zip
            api/.build/migrate.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true
