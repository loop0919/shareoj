name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-deploy-artifacts:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Build SSR frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Build SSR server
        run: npm run build
      - name: Read Playwright version
        id: playwright
        run: node -e 'console.log("version=" + require("./package-lock.json").packages["node_modules/@playwright/test"].version)' >> "$GITHUB_OUTPUT"
      - name: Archive SSR server
        run: tar -czf .build/ssr.tar.gz .output
      - name: Upload SSR server for browser tests
        uses: actions/upload-artifact@v7
        with:
          name: frontend-ssr
          path: web/.build/ssr.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Build and test frontend Lambda
        run: |
          npm run package:lambda
          npm run test:lambda
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate frontend infrastructure
        working-directory: infra/frontend
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test
      - name: Test deployment smoke checks
        run: node --test scripts/smoke-frontend.test.mjs

      - name: Upload frontend Lambda package
        if: inputs.upload-deploy-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lambda
          path: web/.build/web.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  web-tests:
    name: Test frontend (${{ matrix.suite }}, ${{ matrix.shard }}/2)
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, account]
        shard: [1, 2]
        include:
          - suite: browser
            config: playwright.config.ts
          - suite: account
            config: playwright.account.config.ts
    # Match the lockfile so browsers and OS libraries are ready without apt downloads.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.web-build.outputs.playwright-version }}-noble
      options: --ipc=host
    services:
      postgres:
        image: ${{ matrix.suite == 'account' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: openoj_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openoj_test
        options: >-
          --health-cmd "pg_isready -U openoj_test -d openoj_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://openoj_test:test-only-password@postgres:5432/openoj_test?sslmode=disable
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Go
        if: matrix.suite == 'account'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download SSR server
        uses: actions/download-artifact@v8
        with:
          name: frontend-ssr
          path: web/.build
      - name: Extract SSR server
        run: tar -xzf .build/ssr.tar.gz
      - name: Run browser tests
        run: npx playwright test --config ${{ matrix.config }} --shard=${{ matrix.shard }}/2 --reporter=dot,html
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
            web/test-results-account/
          retention-days: 7
          overwrite: true

  web:
    # Keep the existing required check; every shard must succeed before it passes.
    name: Test SSR frontend
    if: ${{ always() }}
    needs: [web-build, web-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all frontend checks
        env:
          BUILD_RESULT: ${{ needs.web-build.result }}
          TEST_RESULT: ${{ needs.web-tests.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  test:
    name: Test and package API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openoj_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: openoj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openoj_test -d openoj_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://openoj_test:test-only-password@127.0.0.1:5432/openoj_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run tests
        working-directory: api
        run: go test ./...

      - name: Run static analysis
        working-directory: api
        run: go vet ./...

      - name: Test and build authoring CLI
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o shareoj .

      - name: Build Lambda package
        working-directory: api
        run: make package package-judge

      - name: Test judge validation and sandbox metadata
        run: python3 -m unittest discover -s judge/tests -v

      - name: Verify Lambda package
        run: |
          test -s api/.build/api.zip
          test -s api/.build/migrate.zip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate and test Terraform
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap api deploy-access judge domain; do
            terraform -chdir="infra/$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$root" validate
            terraform -chdir="infra/$root" test
          done

      - name: Upload API Lambda packages
        if: inputs.upload-deploy-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-lambda
          path: |
            api/.build/api.zip
            api/.build/migrate.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true
