name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-deploy-artifacts:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      record-durations:
        description: Keep each browser test job's JSON report, for scripts/shard-tests.mjs record
        type: boolean
        default: false
      upload-deploy-artifacts:
        description: Upload the Lambda packages as a deploy does, without deploying
        type: boolean
        default: false

permissions:
  contents: read

# Each job aims to end within 30 seconds: jobs that do not need each other run side by side, test
# jobs restore what they need from one cache, and the browser suites are split into shards of
# about equal running time (web/scripts/shard-tests.mjs).
jobs:
  web-ssr:
    name: Build SSR frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser-shards: ${{ steps.build.outputs.browser }}
      account-shards: ${{ steps.build.outputs.account }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-web
        with:
          install: restore
      - name: Build SSR server and split the browser tests
        id: build
        run: |
          # The shard counts: enough that each test job, about 12 s of setup included, ends
          # within 30 s. A run gets 20 runners at a time, so the shards run in waves.
          browser=44 account=14
          bun scripts/shard-tests.mjs split playwright.config.ts "$browser" .build/shards/browser & split_browser=$!
          bun scripts/shard-tests.mjs split playwright.account.config.ts "$account" .build/shards/account & split_account=$!
          bun run build
          wait "$split_browser"
          wait "$split_account"
          echo "browser=[$(seq -s , "$browser")]" >> "$GITHUB_OUTPUT"
          echo "account=[$(seq -s , "$account")]" >> "$GITHUB_OUTPUT"
      - name: Archive the sources, the SSR server and the shards
        # The test jobs start from this archive instead of a checkout of their own: two dozen
        # clones at once took up to half a minute each. Besides web, the tests read the CLI's
        # problem template, and the fixture runs in its package directory.
        working-directory: .
        run: git ls-files -z web .github cli/problem-template.json api/internal/httpapi | tar --zstd --null -T - -cf "$RUNNER_TEMP/ssr.tar.zst" web/.output web/.build/shards
      - name: Upload the archive for the browser tests
        uses: actions/upload-artifact@v7
        with:
          name: frontend-ssr
          path: ${{ runner.temp }}/ssr.tar.zst
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  web-check:
    name: Check frontend types and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun and dependencies
        # A full install, so that every run checks the lockfile.
        uses: ./.github/actions/setup-web
      - name: Check types
        run: bun run typecheck

  web-lambda-build:
    name: Build frontend Lambda
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-web
        with:
          install: restore
      - name: Build the Lambda server
        run: |
          bun run build:lambda
          tar --zstd -cf "$RUNNER_TEMP/lambda-output.tar.zst" .output-lambda
      - name: Upload the Lambda server for packaging
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lambda-output
          path: ${{ runner.temp }}/lambda-output.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  web-lambda:
    # Packaging is a job of its own, so that the build and the package each stay short. It also
    # runs the Bun and Python tests, which need no dependencies.
    name: Package frontend Lambda
    needs: web-lambda-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun
        uses: ./.github/actions/setup-web
        with:
          install: none
      - name: Test the Lambda runtime client, the deployment smoke checks and the test shards
        run: bun test
      - name: Test the pinned Bun release
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Restore the Bun release for the Lambda
        uses: actions/cache@v6.1.0
        with:
          path: web/.build/bun-linux-aarch64-*.zip
          key: bun-release-${{ hashFiles('web/scripts/bun_release.py') }}
      - name: Download the Lambda server
        uses: actions/download-artifact@v8
        with:
          name: frontend-lambda-output
          path: ${{ runner.temp }}
      - name: Package frontend Lambda
        run: |
          tar --zstd -xf "$RUNNER_TEMP/lambda-output.tar.zst"
          python3 scripts/package-lambda.py
      - name: Upload frontend Lambda package
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lambda
          path: web/.build/web.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          # Deploys keep the repository default; other runs need it only for the boot tests.
          retention-days: ${{ inputs.upload-deploy-artifacts && '0' || '1' }}
          overwrite: true

  web-infra:
    name: Validate frontend infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate and test frontend infrastructure
        run: |
          # The tests only hash the Lambda package; web-lambda builds and checks the real one.
          mkdir -p web/.build
          touch web/.build/web.zip
          terraform -chdir=infra/frontend init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/frontend validate
          terraform -chdir=infra/frontend test

  web-lambda-boot:
    # Boot the exact zip that deploys, on arm64 like the function: in the provided.al2023 image
    # it runs on, and on nodejs22.x, which the switch to Bun and its rollback rely on.
    name: Boot frontend Lambda (${{ matrix.runtime }})
    needs: web-lambda
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: provided.al2023
            image: public.ecr.aws/lambda/provided:al2023
          - runtime: nodejs22.x
            image: public.ecr.aws/lambda/nodejs:22
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Bun
        uses: ./.github/actions/setup-web
        with:
          install: none
      - name: Download frontend Lambda package
        uses: actions/download-artifact@v8
        with:
          name: frontend-lambda
          path: web/.build
      - name: Test the packaged handler
        if: matrix.runtime == 'provided.al2023'
        run: bun scripts/test-lambda.mjs
      - name: Boot the package in the Lambda runtime image
        run: bun scripts/test-lambda-image.mjs .build/web.zip ${{ matrix.image }}

  web-browser:
    name: Test browser (${{ matrix.shard }}/${{ strategy.job-total }})
    # Waiting also for the Lambda build queues its packaging ahead of the shards, which would
    # otherwise take every runner and hold back the packaging and the boot tests.
    needs: [web-ssr, web-lambda-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.web-ssr.outputs.browser-shards) }}
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Download the sources and the SSR server
        uses: actions/download-artifact@v8
        with:
          name: frontend-ssr
          path: ${{ runner.temp }}
      - name: Extract the sources and the SSR server
        run: tar --zstd -xf "$RUNNER_TEMP/ssr.tar.zst"
      - name: Set up Bun, dependencies and Chromium
        uses: ./.github/actions/setup-web
        with:
          install: restore
          chromium: 'true'
      - name: Run browser tests
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/durations.json
        run: bun --bun playwright test --test-list .build/shards/browser/${{ matrix.shard }}.txt --reporter=dot,html,json
      - name: Upload browser report and failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          overwrite: true
      - name: Upload the test durations
        if: ${{ !cancelled() && inputs.record-durations }}
        uses: actions/upload-artifact@v7
        with:
          name: durations-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations.json
          retention-days: 1
          overwrite: true

  web-fixture:
    name: Build browser API fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: fixture
      - name: Build the fixture
        working-directory: api
        run: go test -c -ldflags='-s -w' -o .build/browser-fixture ./internal/httpapi
      - name: Upload the fixture
        uses: actions/upload-artifact@v7
        with:
          name: browser-fixture
          path: api/.build/browser-fixture
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  web-account:
    name: Test accounts (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [web-ssr, web-lambda-build, web-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.web-ssr.outputs.account-shards) }}
    env:
      TEST_DATABASE_URL: postgresql://openoj_test:test-only-password@127.0.0.1:5432/openoj_test?sslmode=disable
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Start PostgreSQL
        # In the background, so that the image downloads while the job sets up the rest. In memory
        # and without sync: the tests check queries, not durability.
        run: nohup docker run --detach --name postgres --publish 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql/data --env POSTGRES_USER=openoj_test --env POSTGRES_PASSWORD=test-only-password --env POSTGRES_DB=openoj_test --env POSTGRES_INITDB_ARGS=--no-sync postgres:17 -c fsync=off -c synchronous_commit=off -c full_page_writes=off > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - name: Download the sources, the SSR server and the API fixture
        uses: actions/download-artifact@v8
        with:
          pattern: '{frontend-ssr,browser-fixture}'
          merge-multiple: true
          path: ${{ runner.temp }}
      - name: Extract the sources and the SSR server
        run: |
          tar --zstd -xf "$RUNNER_TEMP/ssr.tar.zst"
          chmod +x "$RUNNER_TEMP/browser-fixture"
      - name: Set up Bun, dependencies and Chromium
        uses: ./.github/actions/setup-web
        with:
          install: restore
          chromium: 'true'
      - name: Run account tests
        working-directory: web
        env:
          OPENOJ_BROWSER_FIXTURE: ${{ runner.temp }}/browser-fixture
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/durations.json
        run: |
          # Over TCP: the image's first start answers only on its socket, then restarts.
          waiting=$(date +%s)
          timeout 90 sh -c 'until docker exec postgres pg_isready --host 127.0.0.1 --username openoj_test --dbname openoj_test > /dev/null 2>&1; do sleep 0.2; done' || { cat "$RUNNER_TEMP/postgres.log"; docker logs postgres; exit 1; }
          echo "Waited $(($(date +%s) - waiting)) s for PostgreSQL"
          bun --bun playwright test --config playwright.account.config.ts --test-list .build/shards/account/${{ matrix.shard }}.txt --reporter=dot,html,json
      - name: Upload browser report and failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-account-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results-account/
          retention-days: 7
          overwrite: true
      - name: Upload the test durations
        if: ${{ !cancelled() && inputs.record-durations }}
        uses: actions/upload-artifact@v7
        with:
          name: durations-account-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations.json
          retention-days: 1
          overwrite: true

  web:
    # Keep the existing required check; every frontend job must succeed before it passes.
    name: Test SSR frontend
    if: ${{ always() }}
    needs: [web-ssr, web-check, web-lambda-build, web-lambda, web-infra, web-lambda-boot, web-browser, web-fixture, web-account]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all frontend checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success; done

  api-test:
    # The handler tests take most of the time. More processes on one runner, which also runs the
    # database server, were no faster, so four runners with a server each share them.
    name: Test API (${{ matrix.part }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      TEST_DATABASE_URL: postgresql://openoj_test:test-only-password@127.0.0.1:5432/openoj_test?sslmode=disable
    steps:
      - name: Start PostgreSQL
        # In the background, so that the image downloads while the job sets up the rest. In memory
        # and without sync: the tests check queries, not durability.
        run: nohup docker run --detach --name postgres --publish 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql/data --env POSTGRES_USER=openoj_test --env POSTGRES_PASSWORD=test-only-password --env POSTGRES_DB=openoj_test --env POSTGRES_INITDB_ARGS=--no-sync postgres:17 -c fsync=off -c synchronous_commit=off -c full_page_writes=off > "$RUNNER_TEMP/postgres.log" 2>&1 &
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: test
      - name: Build the tests
        working-directory: api
        run: go test -run '^$' ./...
      - name: Run tests
        working-directory: api
        run: |
          # Over TCP: the image's first start answers only on its socket, then restarts.
          waiting=$(date +%s)
          timeout 90 sh -c 'until docker exec postgres pg_isready --host 127.0.0.1 --username openoj_test --dbname openoj_test > /dev/null 2>&1; do sleep 0.2; done' || { cat "$RUNNER_TEMP/postgres.log"; docker logs postgres; exit 1; }
          echo "Waited $(($(date +%s) - waiting)) s for PostgreSQL"
          scripts/parallel-test.sh ./internal/httpapi 3 ${{ matrix.part }} ${{ strategy.job-total }}

  api-checks:
    name: Check API and authoring CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: checks
      - name: Run static analysis
        working-directory: api
        run: go vet ./...
      - name: Test and build authoring CLI
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o shareoj .

  api-package:
    name: Package API Lambdas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: package
      - name: Build Lambda package
        working-directory: api
        run: make package package-judge
      - name: Verify Lambda package
        run: |
          test -s api/.build/api.zip
          test -s api/.build/migrate.zip
      - name: Test judge validation and sandbox metadata
        run: python3 -m unittest discover -s judge/tests -v
      - name: Upload API Lambda packages
        if: inputs.upload-deploy-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-lambda
          path: |
            api/.build/api.zip
            api/.build/migrate.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  api-infra:
    name: Validate infrastructure (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, api, deploy-access, judge, domain]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Check Terraform formatting
        if: matrix.root == 'bootstrap'
        run: terraform fmt -check -recursive infra
      - name: Validate and test Terraform
        run: |
          # The tests only hash the Lambda packages; api-package builds and checks the real ones.
          mkdir -p api/.build
          touch api/.build/api.zip api/.build/migrate.zip api/.build/judge-bridge.zip api/.build/judge-notify.zip
          terraform -chdir="infra/${{ matrix.root }}" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="infra/${{ matrix.root }}" validate
          terraform -chdir="infra/${{ matrix.root }}" test

  test:
    # Keep the existing required check; every API job must succeed before it passes.
    name: Test and package API
    if: ${{ always() }}
    needs: [api-test, api-checks, api-package, api-infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all API checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success; done
