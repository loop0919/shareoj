name: Release CLI

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Validate and build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go test ./...
          go vet ./...
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              suffix=''
              if [[ "$os" == windows ]]; then suffix='.exe'; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" -o "dist/shareoj-$os-$arch$suffix" .
            done
          done
          ./dist/shareoj-linux-amd64 version
          cd dist
          sha256sum shareoj-* > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/* --verify-tag --draft \
            --title "ShareOJ CLI $VERSION" --notes 'Prebuilt ShareOJ CLI for Linux, macOS, and Windows. See cli/README.md for installation.'
          gh release edit "$VERSION" --draft=false --latest
