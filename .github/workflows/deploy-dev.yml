name: Deploy dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_name: judge
  TF_VAR_environment: dev
  TF_VAR_aws_region: ap-northeast-1

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upload-deploy-artifacts: true

  deploy:
    name: Deploy API and frontend
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dev
    env:
      TF_VAR_existing_google_domain: judge-dev-loop0919
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_public_site_url: https://www.share-oj.net
      TF_VAR_public_api_url: https://api.share-oj.net
      TF_VAR_operator_subjects: ${{ vars.OPERATOR_SUBJECTS }}
      TF_VAR_judge_runtime_digest: ${{ vars.JUDGE_RUNTIME_DIGEST }}
      TF_VAR_judge_enabled_runtimes: ${{ vars.JUDGE_ENABLED_RUNTIMES || '["cpp17"]' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Download API Lambda packages from CI
        uses: actions/download-artifact@v8
        with:
          name: api-lambda
          path: api/.build

      - name: Download frontend Lambda package from CI
        uses: actions/download-artifact@v8
        with:
          name: frontend-lambda
          path: web/.build

      - name: Set up Bun for deployment smoke check
        # A third-party action in a job that can assume the deploy role: pin the commit.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Set AWS_ACCOUNT_ID to a 12-digit account ID in the dev environment variables."
            exit 1
          fi

          if [[ "$AWS_DEPLOY_ROLE_ARN" != "arn:aws:iam::$AWS_ACCOUNT_ID:role/"* ]]; then
            echo "::error::Set AWS_DEPLOY_ROLE_ARN to an IAM role ARN in the configured AWS account."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Initialize API state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "::error::Set TF_STATE_BUCKET in the dev environment variables."; exit 1; }
          terraform -chdir=infra/api init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=judge/dev/api.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="allowed_account_ids=[\"${{ vars.AWS_ACCOUNT_ID }}\"]"

      - name: Plan API deployment
        # Publication is performed only after target-host smoke, by admission.py.
        # Stale GitHub variables must not revert that tested runtime on a push.
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TF_VAR_judge_runtime_digest" ]]; then
            current="$(aws lambda get-function-configuration --function-name judge-dev-api \
              --query '{digest:Environment.Variables.JUDGE_CPP_IMAGE,runtimes:Environment.Variables.JUDGE_ENABLED_RUNTIMES}' --output json)"
            if ! jq -e --arg digest "$TF_VAR_judge_runtime_digest" --argjson runtimes "$TF_VAR_judge_enabled_runtimes" \
              '.digest == $digest and (((.runtimes // "cpp17") | split(",") | sort) == ($runtimes | sort))' <<< "$current" > /dev/null; then
              echo '::error::Judge publication differs from dev variables. Sync JUDGE_RUNTIME_DIGEST and JUDGE_ENABLED_RUNTIMES after verified admission; do not republish via CI.'
              exit 1
            fi
          fi
          terraform -chdir=infra/api plan -lock-timeout=5m -out=deploy.tfplan

      - name: Apply API deployment
        run: terraform -chdir=infra/api apply -lock-timeout=5m deploy.tfplan

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail
          migration_function="$(terraform -chdir=infra/api output -raw migration_lambda_function_name)"
          aws lambda wait function-updated-v2 --function-name "$migration_function"
          aws lambda invoke --function-name "$migration_function" \
            --cli-read-timeout 150 --cli-binary-format raw-in-base64-out \
            --payload '{}' "$RUNNER_TEMP/migration-result.json" > "$RUNNER_TEMP/migration-invoke.json"
          jq -e '.StatusCode == 200 and (.FunctionError | not)' "$RUNNER_TEMP/migration-invoke.json"
          jq -e '.migrated == true' "$RUNNER_TEMP/migration-result.json"

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail

          health_url="$(terraform -chdir=infra/api output -raw health_url)"

          for attempt in {1..12}; do
            response="$(curl --fail --show-error --silent "$health_url" || true)"
            if jq -e '.status == "ok"' <<< "$response" > /dev/null; then
              {
                echo "### dev deployment"
                echo
                echo "Health check: $health_url"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Health check attempt $attempt failed; retrying in 5 seconds."
            sleep 5
          done

          echo "::error::Health check failed for $health_url"
          exit 1

      - name: Initialize frontend state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/frontend init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=judge/dev/frontend.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="allowed_account_ids=[\"${{ vars.AWS_ACCOUNT_ID }}\"]"

      - name: Plan and apply frontend
        run: |
          set -euo pipefail
          export TF_VAR_api_endpoint="$(terraform -chdir=infra/api output -raw api_endpoint)"
          export TF_VAR_cognito_domain="$(terraform -chdir=infra/api output -raw cognito_domain)"
          export TF_VAR_cognito_client_id="$(terraform -chdir=infra/api output -raw cognito_client_id)"
          cognito_secret="$(terraform -chdir=infra/api output -raw cognito_client_secret)"
          echo "::add-mask::$cognito_secret"
          export TF_VAR_cognito_client_secret="$cognito_secret"
          terraform -chdir=infra/frontend plan -lock-timeout=5m -out=deploy.tfplan
          terraform -chdir=infra/frontend apply -lock-timeout=5m deploy.tfplan

      - name: Verify public frontend
        run: |
          site_url="${TF_VAR_public_site_url:-$(terraform -chdir=infra/frontend output -raw site_url)}"
          bun web/scripts/smoke-frontend.mjs "$site_url"
          echo "Frontend: $site_url" >> "$GITHUB_STEP_SUMMARY"
