name: Set up Chromium
description: Playwright's headless Chromium, cached per Playwright version, and a Japanese font.
inputs:
  playwright-version:
    description: The installed @playwright/test version, which decides the browser build.
    required: true
runs:
  using: composite
  steps:
    - name: Install a Japanese font
      # The runner has Chrome's libraries but no CJK font; use the font the share images ship.
      # Fontconfig reads a directory without a cache by itself, so skip fc-cache.
      shell: bash
      run: |
        mkdir -p ~/.local/share/fonts
        cp web/server/assets/fonts/ipaexg.ttf ~/.local/share/fonts/
    - name: Restore Chromium
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ inputs.playwright-version }}
    - name: Install Chromium
      shell: bash
      working-directory: web
      run: bun --bun playwright install --only-shell chromium
