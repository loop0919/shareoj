<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareOJの運用費</title>
<meta name="description" content="ShareOJの運用にかかった費用と、GitHub Sponsorsでいただいた支援の、月ごとの収支。">
<style>
:root {
  color-scheme: light dark;
  --color-paper: light-dark(#fff, #151b23);
  --color-surface: light-dark(#f5f7fa, #202a36);
  --color-ink: light-dark(#192431, #e6edf3);
  --color-muted: light-dark(#536171, #a8b6c5);
  --color-line: light-dark(#dce2e8, #3a4858);
  --color-accent: light-dark(#18794e, #70dba2);
  --color-expense: light-dark(#b42318, #ff9b8f);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--color-ink);
  background: var(--color-paper);
  font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  line-height: 1.85;
}
main { max-width: 52rem; margin: 0 auto; padding: 2.5rem 16px 4rem; }
h1 { margin: 0 0 .5rem; font-size: 1.5rem; line-height: 1.45; }
p { margin: 0; }
a { color: var(--color-accent); }
.lead { color: var(--color-muted); }
.empty { margin-top: 2.5rem; color: var(--color-muted); }
/* The table is wider than a phone; it scrolls inside this box and the page itself stays still. */
.ledger { margin-top: 2rem; overflow-x: auto; }
.ledger:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
th, td { padding: .5rem .75rem; border: 1px solid var(--color-line); white-space: nowrap; }
thead th { background: var(--color-surface); font-size: .8125rem; font-weight: 700; text-align: center; }
tbody th { text-align: left; font-weight: 400; }
td { text-align: right; font-variant-numeric: tabular-nums; }
.income { color: var(--color-accent); }
.expense { color: var(--color-expense); }
.balance { font-weight: 700; }
/* The month stays in view while the amounts scroll sideways. */
tbody th, thead tr:first-child th:first-child { position: sticky; left: 0; background: var(--color-paper); }
thead tr:first-child th:first-child { background: var(--color-surface); }
sup { margin-left: .25em; color: var(--color-muted); font-size: .6875rem; }
.notes { margin: 1rem 0 0; padding-left: 1.25em; color: var(--color-muted); font-size: .875rem; }
footer { margin-top: 3rem; color: var(--color-muted); font-size: .875rem; }
footer p + p { margin-top: .5rem; }
</style>
</head>
<body>
<main>
<h1>ShareOJの運用費</h1>
<p class="lead">ShareOJの運用にかかった費用と、GitHub Sponsorsでいただいた支援の収支です。支出はAWSの請求額を、月に一度、自動でそのまま載せています。</p>
<p class="lead">金額は米ドルです。</p>
$ledger
<footer>
$updated
$sponsors
<p><a href="https://www.share-oj.net">ShareOJ</a></p>
</footer>
</main>
</body>
</html>
